button{font:inherit;color:inherit}

.topin{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
#view{max-width:720px;margin:0 auto;padding:4px 14px 8px}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--mute);font:600 14px Barlow,sans-serif;padding:8px 6px;border-radius:9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-selected=true],.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.lgseg{flex:1}

.ic{width:40px;height:40px;flex:none;border:0;border-radius:12px;background:var(--seg);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ic.on{background:var(--ink);color:var(--bg)}
.ctx{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 10px}
.who{border:0;background:none;font:700 20px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.01em;padding:4px 0;cursor:pointer;text-align:left}
.stat{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}.dot.ok{background:var(--turf)}.dot.busy{background:var(--amber)}.dot.err{background:var(--bad)}
.card,section{background:var(--panel);border-radius:16px;padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font:700 12px Barlow,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 4px}
.cnt{font-weight:600;opacity:.7}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.tile{background:var(--panel);border-radius:14px;padding:10px 4px 9px;text-align:center;box-shadow:var(--shadow)}
.tile small{display:block;font:600 10.5px Barlow,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.tile b{display:block;font:700 30px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;margin-top:2px}
.tile i{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.li,.chip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.card h2+.li,.card h2+.chip,.card h2+.move,.card h2+.offer,.ph+.li{border-top:0}

.lr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%}
.nm{min-width:0}.nm small{color:var(--mute)}

  g.forEach(x=>{const o=g.length>1?(tot-x.v)/(g.length-1):0,rest=g.filter(y=>y!==x),z=net[x.rid]=net[x.rid]||{n:0,v:0,ai:[],ao:[],pi:0,po:0};z.n++;z.v+=x.v-o;z.ai.push(...x.ag);rest.forEach(y=>{z.ao.push(...y.ag);z.po+=y.pk});z.pi+=x.pk});
  const w=g.slice().sort((a,b)=>b.v-a.v)[0],o=g.length>1?(tot-w.v)/(g.length-1):0,mg=w.v?Math.round((w.v-o)/w.v*100):0;
  return`<div class="li" style="display:block"><small class="note">Week ${tr.w}</small>${g.map(x=>`<div><b>${esc(tn(L.id,x.rid))}</b> got ${esc(x.nm.join(", ")||"nothing")} <small>(${fmt(x.v)})</small></div>`).join("")}<small class="note">${mg>=8?esc(tn(L.id,w.rid))+" came out ahead by "+mg+"%":"Roughly even"}</small></div>`}).join("");
 const tend=n=>{const z=net[n];if(!z)return"";const av=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,ai=av(z.ai),ao=av(z.ao),t=[];if(ai!=null&&ao!=null){if(ao-ai>=1.5)t.push("buys youth");else if(ai-ao>=1.5)t.push("buys vets")}if(z.pi-z.po>=1)t.push("collects picks");else if(z.po-z.pi>=1)t.push("spends picks");return t.length?" · "+t.join(", "):""};
 const sum=R.map(t=>({t,n:(net[t.n]||{n:0}).n,v:(net[t.n]||{v:0}).v})).sort((a,b)=>b.v-a.v);
 return`<div class="card"><h2>Who trades well</h2>${sum.map(x=>`<div class="li"><div class="nm">${esc(tn(L.id,x.t.n))}${x.t.me?" (you)":""}<br><small>${x.n} trade${x.n===1?"":"s"}${tend(x.t.n)}</small></div><span class="val">${x.v>=0?"+":""}${fmt(x.v)}</span></div>`).join("")}<p class="note">Net value received minus given, at today's values. Teams with no trades may be open to offers or just inactive.</p></div>
 <div class="card"><h2>Trades <span class="cnt">${T.length}</span></h2>${cards||'<p class="note">No completed trades found yet.</p>'}</div>`}

/* ---------- More ---------- */
function valRows(){const {L}=C(),q=UI.vq;
 return S.players.filter(p=>!q||p.name.toLowerCase().includes(q)).sort((a,b)=>b.value-a.value).slice(0,60).map(p=>{const s=p.s||{},g=s.dp&&s.fc?Math.round((s.fc-s.dp)/((s.fc+s.dp)/2)*100):null,w=(S.watch||[]).includes(p.id);
  return`<div class="li"><div class="nm">${esc(p.name)}<br><small>${pinfo(p)}${s.dp?" · Exp "+s.dp:""}${s.fc?" · Mkt "+s.fc:""}${g!==null?" · gap "+(g>0?"+":"")+g+"%":""}</small></div><div class="acts"><button class="mini ${w?"on":""}" data-act="watch" data-id="${p.id}" aria-label="Watch">${w?"★":"☆"}</button>${p.m?`<button class="mini" data-act="del" data-id="${p.id}" aria-label="Delete">✕</button>`:""}<span class="val">${fmt(p.value)}</span></div></div>`}).join("")||'<p class="note">No matches.</p>'}
function pMore(){const {L,R}=C(),w=(S.watch||[]).map(byId).filter(Boolean);
 const wl=w.length?w.map(p=>{const t=R.find(x=>x.p.includes(p.id));return`<div class="li"><div class="nm">${esc(p.name)}${ibx(p.id)}<br><small>${pinfo(p)}${trendTxt(p)} · ${t?esc(tn(L.id,t.n)):"free agent"}</small></div><div class="acts"><button class="mini on" data-act="watch" data-id="${p.id}">★</button><span class="val">${fmt(adj(p,L))}</span></div></div>`}).join(""):'<p class="note">Tap ☆ next to any player to watch him.</p>';
 return`<div class="back"><button class="ic" data-act="back" aria-label="Back">←</button><h2>More</h2></div>
 <div class="card"><h2>Strategy</h2><div class="seg">${[[-1,"Contend"],[0,"Balanced"],[1,"Rebuild"]].map(([v,n])=>`<button data-act="mode" data-v="${v}" aria-pressed="${(S.mode||0)===v}">${n}</button>`).join("")}</div><p class="note">How much youth and picks count in every value, offer and grade.</p></div>
 <div class="card"><h2>Watchlist <span class="cnt">${w.length}</span></h2>${wl}</div>
 <div class="card"><h2>Value board</h2><input data-inp="vq" placeholder="Search players or picks" value="${esc(UI.vq)}" autocomplete="off"><div id="vlist">${valRows()}</div></div>
 <div class="card"><h2>Compare players</h2><div class="row"><input list="pl2" id="c1" placeholder="Player 1"><input list="pl2" id="c2" placeholder="Player 2"></div><datalist id="pl2">${S.players.filter(p=>p.pos!=="PICK").map(p=>`<option value="${esc(p.name)}">`).join("")}</datalist><p><button class="btn sm" data-act="cmp">Compare</button></p><div id="cmpo">${UI.cmpHtml}</div></div>
 <details class="card"><summary>Value sources and weights</summary><p class="note">Values: ${esc(VALINFO)}. <b>Experts</b> = DynastyProcess (FantasyPros rankings). <b>Market</b> = FantasyCalc, built from real trades and matched to each league's settings. Each is scaled to 10,000 at the top, then blended.</p><div class="row"><div><label>Experts weight</label><input type="number" step=".5" min="0" max="3" data-chg="w:dp" value="${S.weights.dp}"></div><div><label>Market weight</label><input type="number" step=".5" min="0" max="3" data-chg="w:fc" value="${S.weights.fc}"></div></div></details>
 <details class="card"><summary>League tuning</summary>${S.leagues.map((l,i)=>`<h2 style="margin-top:12px">${esc(l.name)}</h2><label>Position multipliers (1.00 = neutral)</label><div class="row">${["QB","RB","WR","TE"].map(p=>`<div><label>${p}</label><input type="number" step=".01" data-chg="tune" data-i="${i}" data-m="${p}" value="${l.mult[p]}"></div>`).join("")}</div><label>Stud premium (0 = values add up, 1 = stars dominate)</label><input type="number" step=".1" min="0" max="1.5" data-chg="tune" data-i="${i}" data-f="stud" value="${l.stud}"><label>Age decline</label><select data-chg="tune" data-i="${i}" data-f="age"><option value="1" ${l.age?"selected":""}>On</option><option value="0" ${l.age?"":"selected"}>Off</option></select>`).join("")}</details>
 <details class="card"><summary>Add or import values</summary><div class="row"><input id="n" placeholder="Name"><select id="ps">${POS.map(p=>`<option>${p}</option>`).join("")}</select></div><div class="row"><input id="ag" type="number" placeholder="Age"><input id="vl" type="number" placeholder="Value (0–10000)"></div><p><button class="btn sm" data-act="addman">Save to board</button></p><label>Import rows: name,pos,age,value</label><textarea id="csv" placeholder="Player Name,WR,23,7800"></textarea><p><button class="btn sm" data-act="imp">Import</button></p></details>
 <details class="card"><summary>Data and status</summary><p class="note">Rosters: ${esc(SYNCINFO)}<br>Values: ${esc(VALINFO)}</p><p><button class="btn sm" data-act="sync">Sync with Sleeper</button> <button class="btn sm ghost" data-act="refvals">Refresh values</button></p><p><button class="btn sm ghost" data-act="reset">Reset saved data on this device</button></p></details>`}

/* ---------- render + events ---------- */
const PAGES={"team.lineup":pLineup,"team.roster":pRoster,"team.outlook":pOutlook,"trade.ideas":pIdeas,"trade.build":pBuild,"draft.order":pOrder,"draft.picks":pPicks,"draft.board":pBoard,"league.power":pPower,"league.pos":pPos,"league.trades":pTrades};
function render(){
 try{hdr();navr();renderSheet()}catch(e){console.error(e)}
 let h;try{h=UI.tab==="more"?pMore():UI.tab==="home"?pHome():segr()+PAGES[UI.tab+"."+UI.sub[UI.tab]]()}catch(e){console.error(e);h=`<div class="card"><p class="note">Something went wrong on this page (${esc(e.message)}). Try Sync, or reset in More.</p></div>`}
 $("view").innerHTML=h}
function goto(t,s){UI.tab=t;if(s)UI.sub[t]=s;UI.sheet=null;render();try{window.scrollTo(0,0)}catch(e){}}
function doAct(a,d){const {L,R,me}=C(),T=S.trade;
 switch(a){
 case"tab":return goto(d.v);
 case"go":return goto(d.t,d.s);
 case"sub":UI.sub[UI.tab]=d.v;render();try{window.scrollTo(0,0)}catch(e){}return;
 case"lg":if(d.v!==L.id){S.trade.league=d.v;T.give=[];T.get=[];T.partner=null;save()}UI.sheet=null;return render();
 case"sync":return syncSleeper();
 case"more":if(UI.tab==="more"){UI.tab=UI.prev||"home"}else{UI.prev=UI.tab;UI.tab="more"}render();try{window.scrollTo(0,0)}catch(e){}return;
 case"back":UI.tab=UI.prev||"home";return render();
 case"who":UI.sheet={t:"who"};return render();
 case"close":UI.sheet=null;return render();
 case"setme":S.viewAs=S.viewAs||{};S.viewAs[d.lg]=+d.n;S.viewAsSet=true;save();applyMe();return render();
 case"fg":UI.fg=d.v;if(d.v==="PICK"&&UI.ft==="PICK")UI.ft="ALL";return render();
 case"ft":UI.ft=d.v;return render();
 case"offer":{if(!me)return;const o=getOffers(L,me,R,d.f==="1")[+d.i];if(!o)return;T.partner=o.t.n;T.give=o.c.slice();T.get=gets(o).slice();save();return goto("trade","build")}
 case"shop":T.give=[d.id];T.get=[];save();return goto("trade","build");
 case"target":T.partner=+d.n;T.get=[d.id];T.give=[];save();return goto("trade","build");
 case"add":UI.sheet={t:"pick",k:d.k};UI.pq="";UI.pf="ALL";return render();
 case"pf":UI.pf=d.v;return render();
 case"addp":if(!T[UI.sheet.k].includes(d.id))T[UI.sheet.k].push(d.id);save();toast("Added");return render();
 case"addq":if(!T[d.k].includes(d.id))T[d.k].push(d.id);save();return render();
 case"rm":T[d.k]=T[d.k].filter(x=>x!==d.id);save();return render();
 case"clear":T.give=[];T.get=[];save();return render();
 case"pitch":return copyText(PITCH||"Add players to both sides first.");
 case"recap":return copyText(RECAP);
 case"watch":{S.watch=S.watch||[];const i=S.watch.indexOf(d.id);if(i>=0)S.watch.splice(i,1);else S.watch.push(d.id);save();return render()}
 case"blk":{S.block=S.block||{};const l=S.block[L.id]=S.block[L.id]||[],i=l.indexOf(d.id);if(i>=0)l.splice(i,1);else l.push(d.id);save();return render()}
 case"rpos":UI.rpos=d.v;return render();
 case"mode":S.mode=+d.v;save();return render();
 case"cmp":{const f=n=>S.players.find(p=>p.name.toLowerCase()===n.trim().toLowerCase()),x=f($("c1").value),y=f($("c2").value);
  if(!x||!y)UI.cmpHtml='<p class="note">Pick two players from the lists.</p>';
  else{const rows=[["Position / age",p=>pinfo(p)],["Value in "+L.name,p=>fmt(adj(p,L))],["Experts",p=>p.s&&p.s.dp||"–"],["Market",p=>p.s&&p.s.fc||"–"],["30-day trend",p=>p.tr||0],["In 1 year",p=>fmt(adj(p,L)*projF(p,1))],["In 2 years",p=>fmt(adj(p,L)*projF(p,2))],["In 3 years",p=>fmt(adj(p,L)*projF(p,3))]];
   UI.cmpHtml=`<div class="scroll"><table><tr><th></th><th>${esc(x.name)}</th><th>${esc(y.name)}</th></tr>${rows.map(([l,fn])=>`<tr><td>${l}</td><td>${fn(x)}</td><td>${fn(y)}</td></tr>`).join("")}</table></div>`}
  return render()}
 case"addman":{const n=$("n").value.trim(),v=+$("vl").value;if(!n||!v)return toast("Need a name and value");upsert({name:n,pos:$("ps").value,age:+$("ag").value||0,value:v});save();toast("Saved");return render()}
 case"imp":{let c=0;$("csv").value.split("\n").forEach(l=>{const a=l.split(",").map(s=>s.trim()),v=+a[3],pos=(a[1]||"").toUpperCase();if(a[0]&&POS.includes(pos)&&v>0){upsert({name:a[0],pos,age:+a[2]||0,value:v});c++}});save();toast(c+" imported");return render()}
 case"del":S.manual=S.manual.filter(p=>p.id!==d.id);build();T.give=T.give.filter(x=>x!==d.id);T.get=T.get.filter(x=>x!==d.id);save();return render();
 case"refvals":toast("Refreshing values…");return refreshValues().then(ok=>{toast(ok?"Values refreshed":"Could not reach sources");render()}).catch(()=>toast("Could not reach sources"));
 case"reset":if(typeof confirm==="function"&&!confirm("Clear everything saved on this device (settings, watchlist, history)?"))return;
  ["dd2","dd2sync","dd2hist","dd2vals","dd2vh","dd2inj","dd2last"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});return location.reload();
 }}
function doChg(a,t){const {L,R}=C(),T=S.trade;
 if(a==="partner"){T.partner=+t.value;T.get=[];save();return render()}
 if(a==="mu1"){UI.mu.a=+t.value;return render()}
 if(a==="mu2"){UI.mu.b=+t.value;return render()}
 if(a.startsWith("w:")){S.weights[a.slice(2)]=Math.max(0,+t.value);recompute();save();return render()}
 if(a==="tune"){const l=S.leagues[+t.dataset.i];if(t.dataset.m)l.mult[t.dataset.m]=+t.value||1;else if(t.dataset.f==="age")l.age=t.value==="1";else if(t.dataset.f==="stud")l.stud=Math.max(0,+t.value||0);save();VER++;return render()}}
function doInp(a,t){if(a==="pq"){UI.pq=t.value.toLowerCase();const el=$("pklist");if(el)el.innerHTML=pickList()}
 if(a==="vq"){UI.vq=t.value.toLowerCase();const el=$("vlist");if(el)el.innerHTML=valRows()}}
document.addEventListener("click",e=>{const b=e.target&&e.target.closest?e.target.closest("[data-act]"):null;if(b)doAct(b.dataset.act,b.dataset,b)});
document.addEventListener("change",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.chg)doChg(t.dataset.chg,t)});
document.addEventListener("input",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.inp)doInp(t.dataset.inp,t)});

try{const c=JSON.parse(localStorage.getItem("dd2sync"));if(c&&c.ROST){ROST=c.ROST;STAND=c.STAND;LPICKS=c.LPICKS;TEAMS=c.TEAMS||{};TRADES=c.TRADES||{};LGI=c.LGI||{};LSCH=c.LSCH||{};if(c.WEEK!=null)WEEK=c.WEEK;SYNCINFO=c.SYNCINFO+" (saved)";build()}}catch(e){}
loadVals();applyMe();UI.sheet=S.viewAsSet?null:{t:"who"};
render();syncSleeper();
</script></body></html>

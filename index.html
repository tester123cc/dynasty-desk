 case"psim":{const tr=(PENDING[L.id]||[])[+d.i];if(!tr||!me)return;const sd=tradeSides(L,tr),mn=sd.find(s=>s.rid===me.n),o=sd.find(s=>s!==mn),par=o&&R.find(t=>t.n===o.rid);if(!mn||!par||sd.length!==2){toast("Needs a two-team trade that includes you");return}UI.pwi={i:+d.i,html:wiHtml(L,R,me,par,{give:o.ids,get:mn.ids})};return render()}
 case"pbuild":{const tr=(PENDING[L.id]||[])[+d.i];if(!tr||!me)return;const sd=tradeSides(L,tr),mn=sd.find(s=>s.rid===me.n),o=sd.find(s=>s!==mn);if(!mn||!o){toast("Needs a two-team trade that includes you");return}T.partner=o.rid;T.give=o.ids.slice();T.get=mn.ids.slice();return goto("trade","build")}
 case"watch":{S.watch=S.watch||[];const i=S.watch.indexOf(d.id);if(i>=0)S.watch.splice(i,1);else S.watch.push(d.id);save();return render()}
 case"blk":{S.block=S.block||{};const l=S.block[L.id]=S.block[L.id]||[],i=l.indexOf(d.id);if(i>=0)l.splice(i,1);else l.push(d.id);save();return render()}
 case"rpos":UI.rpos=d.v;return render();
 case"mode":S.modeL=S.modeL||{};S.modeL[L.id]=+d.v;S.modeSet=S.modeSet||{};S.modeSet[L.id]=1;save();return render();
 case"rbon":S.modeL=S.modeL||{};S.modeL[L.id]=1;S.modeSet=S.modeSet||{};S.modeSet[L.id]=1;save();UI.tab="home";UI.sub.home="plan";return render();
 case"rboff":S.modeL=S.modeL||{};S.modeL[L.id]=0;S.modeSet=S.modeSet||{};S.modeSet[L.id]=1;save();return render();
 case"cmp":{const f=n=>S.players.find(p=>p.name.toLowerCase()===n.trim().toLowerCase()),x=f($("c1").value),y=f($("c2").value);
  if(!x||!y)UI.cmpHtml='<p class="note">Pick two players from the lists.</p>';
  else{const rows=[["Position / age",p=>pinfo(p)],["Value in "+L.name,p=>fmt(adj(p,L))],["Experts",p=>p.s&&p.s.dp||"–"],["Market",p=>p.s&&p.s.fc||"–"],["30-day trend",p=>p.tr||0],["In 1 year",p=>fmt(adj(p,L)*projF(p,1))],["In 2 years",p=>fmt(adj(p,L)*projF(p,2))],["In 3 years",p=>fmt(adj(p,L)*projF(p,3))]];
   UI.cmpHtml=`<div class="scroll"><table><tr><th></th><th>${esc(x.name)}</th><th>${esc(y.name)}</th></tr>${rows.map(([l,fn])=>`<tr><td>${l}</td><td>${fn(x)}</td><td>${fn(y)}</td></tr>`).join("")}</table></div>`}
  return render()}
 case"addman":{const n=$("n").value.trim(),v=+$("vl").value;if(!n||!v)return toast("Need a name and value");upsert({name:n,pos:$("ps").value,age:+$("ag").value||0,value:v});save();toast("Saved");return render()}
 case"imp":{let c=0;$("csv").value.split("\n").forEach(l=>{const a=l.split(",").map(s=>s.trim()),v=+a[3],pos=(a[1]||"").toUpperCase();if(a[0]&&POS.includes(pos)&&v>0){upsert({name:a[0],pos,age:+a[2]||0,value:v});c++}});save();toast(c+" imported");return render()}
 case"del":S.manual=S.manual.filter(p=>p.id!==d.id);build();T.give=T.give.filter(x=>x!==d.id);T.get=T.get.filter(x=>x!==d.id);save();return render();
 case"ktcimp":{const m=parseKTC(($("ktc")||{}).value);if(!m){toast("Could not read that. Paste the KeepTradeCut page source or the player JSON.");return}setKTV(m);toast("KeepTradeCut loaded: "+Object.keys(m).length+" values");return render()}
case"wsim":{const {L,R,me}=C(),T=S.trade,par=R.find(t=>t.n===T.partner);if(!me||!par||(!T.give.length&&!T.get.length)){toast("Add players to the trade first");return}UI.wi={key:wiKey(),html:wiHtml(L,R,me,par,T)};return render()}
case"refvals":toast("Refreshing values…");return refreshValues().then(ok=>{toast(ok?"Values refreshed":"Could not reach sources");render()}).catch(()=>toast("Could not reach sources"));
 case"reset":if(typeof confirm==="function"&&!confirm("Clear everything saved on this device (settings, watchlist, history)?"))return;
  ["dd2","dd2sync","dd2hist","dd2vals","dd2vh","dd2inj","dd2last"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});return location.reload();
 }}

 if(a==="fg"){UI.fg=t.value;if(t.value==="PICK"&&UI.ft==="PICK")UI.ft="ALL";return render()}
 if(a==="ft"){UI.ft=t.value;return render()}

 if(a==="tune"){const l=S.leagues[+t.dataset.i];if(t.dataset.m)l.mult[t.dataset.m]=+t.value||1;else if(t.dataset.f==="age")l.age=t.value==="1";else if(t.dataset.f==="stud")l.stud=Math.max(0,+t.value||0);save();VER++;return render()}}

 if(a==="vq"){UI.vq=t.value.toLowerCase();const el=$("vlist");if(el)el.innerHTML=valRows()}}

/* ===================== v7 REBUILD MODULE ===================== */
const SEAS=()=>{const d=new Date();return d.getMonth()>=2?d.getFullYear():d.getFullYear()-1};
const rbOn=()=>{const {L}=C();return stg(L.id)===1};
const bv=(p,L)=>p.value*(L.mult[p.pos]||1);
/* age curves: relative trade value by age. Sources: RB peak ~24.8 and steep drop after; WR peak ~27, holds to ~30; TE peak ~26.8; pocket QB peak ~30; running QB ~26 */
const CRV={
 RB:[[21,.9],[22,.95],[23,1],[24,1],[25,.9],[26,.72],[27,.52],[28,.36],[29,.24],[30,.15],[32,.08]],
 WR:[[21,.88],[22,.92],[23,.96],[24,.99],[25,1],[27,1],[28,.93],[29,.82],[30,.65],[31,.5],[32,.35],[34,.15]],
 TE:[[21,.85],[22,.88],[23,.92],[24,.95],[25,.98],[26,1],[27,1],[28,.9],[29,.75],[30,.6],[31,.45],[32,.3],[34,.12]],
 QB:[[21,.85],[22,.88],[23,.91],[24,.94],[25,.96],[26,.98],[27,.99],[28,1],[32,1],[33,.92],[34,.8],[35,.65],[36,.5],[37,.38],[40,.15]],
 QBr:[[21,.88],[22,.92],[23,.95],[24,.98],[25,1],[28,1],[29,.9],[30,.8],[31,.65],[32,.5],[33,.38],[36,.15]]};
const CL={RB:25,WR:28,TE:28,QB:33,QBr:29};
const RUNQ=["p_lamar_jackson","p_josh_allen","p_jalen_hurts","p_jayden_daniels","p_anthony_richardson","p_kyler_murray","p_justin_fields"];
function cv(k,a){const c=CRV[k];if(a<=c[0][0])return c[0][1];for(let i=1;i<c.length;i++){if(a<=c[i][0]){const[x0,y0]=c[i-1],[x1,y1]=c[i];return y0+(y1-y0)*(a-x0)/(x1-x0)}}return c[c.length-1][1]}
const ckey=p=>p.pos==="QB"&&RUNQ.includes(p.id)?"QBr":p.pos;
const agev=p=>p.age||25;
function fct(p,y){if(p.pos==="PICK"||!CRV[ckey(p)])return 1;const k=ckey(p),a=agev(p);return Math.max(.05,Math.min(1.6,cv(k,a+y)/cv(k,a)))}
const pkI=id=>{const m=/^pk_(\w)_(\d)_(\d+)(?:_(\d\d))?$/.exec(id);return m?{lg:m[1],r:+m[2],o:+m[3],yr:m[4]?2000+ +m[4]:SEAS()+1}:null};
const SUF=["","1st","2nd","3rd","4th"];
const GEN=(r,t)=>{const a=SM.get("p_2027_"+SUF[r]+(t?"_"+t:""));return a?a.value:0};
const tmult=(r,t)=>{const g=GEN(r,"");return g?GEN(r,t)/g:1};
const tierOf=(rank,n)=>rank>n*2/3?"early":rank>n/3?"mid":"late";
function lsum(en,sl){const ps=en.slice().sort((a,b)=>b.v-a.v),used=new Set(),by={},lu=[];let tot=0;
 const take=(el,lab)=>{for(let i=0;i<ps.length;i++){if(!used.has(i)&&el.includes(ps[i].pos)){used.add(i);tot+=ps[i].v;by[ps[i].pos]=(by[ps[i].pos]||0)+ps[i].v;lu.push([lab,ps[i]]);return}}lu.push([lab,null])};
 ["QB","RB","WR","TE"].forEach(pos=>{for(let i=0;i<sl[pos];i++)take([pos],pos)});
 for(let i=0;i<sl.SF;i++)take(["QB","RB","WR","TE","PK"],"SF");for(let i=0;i<sl.FLEX;i++)take(["RB","WR","TE","PK"],"FLEX");
 return{tot,by,lu}}
/* window: projected starter strength for every team, now through +4 seasons. Picks become players the season after their draft. */
function winProj(L,R,tag){return memo("win|"+(tag||"")+"|"+L.id+"|"+SEAS()+"|"+JSON.stringify(S.weights)+JSON.stringify(L.mult)+"|"+MKT,()=>{
 const sl=SLOTS[L.id],Y=5,rank=[],str=[],by=[];
 for(let y=0;y<Y;y++){const o={},b={};
  R.forEach(t=>{const en=[];t.p.map(byId).filter(Boolean).forEach(p=>{if(p.pos==="PICK"){const i=pkI(p.id);if(!i)return;const ys=y-(i.yr-SEAS());if(ys>=0)en.push({pos:"PK",v:bv(p,L)*(1+.04*Math.min(ys,3))})}else en.push({pos:p.pos,v:bv(p,L)*fct(p,y)})});
   const r=lsum(en,sl);o[t.n]=r.tot;b[t.n]=r.by});
  const ord=R.map(t=>t.n).sort((a,b)=>o[b]-o[a]),rk={};ord.forEach((n,i)=>{rk[n]=i+1});rank.push(rk);str.push(o);by.push({b,ord})}
 return{rank,str,by}})}
const GOALS=[null,8,5,2];
function gapTo(W,me,y,k){const ord=W.by[y].ord,line=W.str[y][ord[Math.min(k,ord.length)-1]];return Math.max(0,line-W.str[y][me.n])}
/* roster audit */
function audit(L,R,me){
 const core=new Set((S.core||{})[L.id]||[]),lu=lineup(me.p,L,SLOTS[L.id]),st=new Set(lu.filter(x=>x[1]).map(x=>x[1].p.id));
 const ps=me.p.map(byId).filter(p=>p&&p.pos!=="PICK");
 const rows=ps.map(p=>{const v=bv(p,L),a=agev(p),f1=fct(p,1),f3=fct(p,3),v3=v*f3;let cat,why,prem=false;
  if(core.has(p.id)){cat="core";why="Locked as a core piece."}
  else if(v>=600&&(f1<=.88||a>=CL[ckey(p)]-1.5)){cat="sellnow";why=(f1<=.88?p.pos+" value drops about "+Math.round((1-f1)*100)+"% within a year.":"Within about 18 months of the "+p.pos+" age cliff. Selling a year early beats a year late.")+(ckey(p)==="QBr"?" Running QBs decline earlier.":"")}
  else if(v>=600&&f3<.7){cat="sellwin";why="Projects to "+Math.round(f3*100)+"% of today's value by "+(SEAS()+3)+"."}

/* ===== live Sleeper rookie draft =====

const RB_SEASON="2027";

async function drFind(lg){const id=LEAGUES[lg],c=[];
 try{(await jget("/league/"+id+"/drafts")).forEach(d=>c.push(d))}catch(e){}
 try{if(!DR_UID)DR_UID=(await jget("/user/"+SLEEPER_USER)).user_id;
  const nx=(await jget("/user/"+DR_UID+"/leagues/nfl/"+RB_SEASON)).filter(l=>l.previous_league_id===id&&l.league_id!==id);
  for(const l of nx){try{(await jget("/league/"+l.league_id+"/drafts")).forEach(d=>c.push(d))}catch(e){}}}catch(e){}
 /* a rookie draft: next season, not an auction, a handful of rounds; prefer one that is running */
 const rk=d=>String(d.season)===RB_SEASON&&d.type!=="auction"&&((d.settings||{}).rounds||99)<=8?({drafting:0,paused:1,complete:2,pre_draft:3}[d.status]??4):9;
 return c.filter(d=>rk(d)<9).sort((a,b)=>rk(a)-rk(b)||(b.start_time||0)-(a.start_time||0))[0]||null}

function drOrder(lg){const d=DRS[lg]&&DRS[lg].d;if(!d||!d.slot_to_roster_id)return null;const n=(d.settings||{}).teams||12,o=Array.from({length:n},(_,i)=>+d.slot_to_roster_id[i+1]||0);return o.every(Boolean)?o:null}

 const s=d.settings||{},teams=s.teams||12,rounds=s.rounds||4,nm=n=>(TEAMS[lg]&&TEAMS[lg][n])||("Team "+n),me=(ROST[lg]||[]).find(t=>t.me);

 /* who is on the clock: the slot's original team, unless that pick was traded */
 let next=null;const n=picks.length+1,ord=drOrder(lg);
 if((d.status==="drafting"||d.status==="paused")&&n<=teams*rounds&&ord){const r=Math.ceil(n/teams),i=(n-1)%teams,slot=(d.type==="snake"&&r%2===0)?teams-i:i+1,orig=ord[slot-1];
  const tr=(st.tp||[]).find(x=>+x.round===r&&+x.roster_id===orig),rid=tr?+tr.owner_id:orig;next={n,lab:lab(n),team:nm(rid),mine:!!me&&rid===me.n}}
 return{lg,id:d.draft_id,status:d.status,type:d.type,start:d.start_time||null,teams,rounds,total:teams*rounds,picks,next,t:st.t||Date.now()}}
function drSend(){if(!RB_FRAME||!RB_FRAME.contentWindow)return;const L=L_();if(!L)return;try{RB_FRAME.contentWindow.postMessage({type:"dd-draft",payload:drPayload(L.id)},"*")}catch(e){console.error(e)}}
async function drTick(full){clearTimeout(DR_T);let wait=300000;

  const ok=JSON.stringify(["A","B"].map(lg=>[drOrder(lg),DRS[lg].d&&DRS[lg].d.type]));if(ok!==DRS.ok){DRS.ok=ok;rbSend()}else drSend()}catch(e){}

 if(ds.some(d=>d.status==="drafting"))wait=8000;else if(ds.some(d=>d.status==="paused"))wait=60000;else if(ds.some(d=>d.status==="pre_draft"&&d.start_time&&d.start_time-now<3*3600e3))wait=30000;

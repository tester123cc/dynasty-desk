<style>
:root{--bg:#e9eef2;--panel:#fff;--ink:#101b27;--mute:#5b6b7a;--line:#cfd8e0;--turf:#1f5c3a;--flag:#e8b923;--bad:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--panel:#17222e;--ink:#e8eef3;--mute:#8fa1b2;--line:#2a3846;--turf:#4fae7b;--flag:#f0c63c;--bad:#e5675c}}
:root[data-theme="dark"]{--bg:#0f1720;--panel:#17222e;--ink:#e8eef3;--mute:#8fa1b2;--line:#2a3846;--turf:#4fae7b;--flag:#f0c63c;--bad:#e5675c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;max-width:720px;margin-inline:auto;padding:14px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.01em}
h1{font-size:34px;line-height:1}h2{font-size:22px;margin-bottom:8px}
.sub{color:var(--mute);margin:2px 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 15px Barlow,sans-serif;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:16px Barlow,sans-serif}
textarea{min-height:90px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:9px 12px;border:0;border-radius:7px;background:var(--turf);color:#fff;font:600 15px Barlow,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.x{background:none;border:0;color:var(--bad);font-size:18px;cursor:pointer;padding:0 6px}
.chip{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.chip small{color:var(--mute)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.verdict{font:700 30px "Barlow Condensed",sans-serif;margin:4px 0}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:6px 0}
.bar i{display:block;height:100%}.bar .a{background:var(--bad)}.bar .b{background:var(--turf)}
.flag{display:inline-block;background:var(--flag);color:#101b27;font:700 13px Barlow,sans-serif;padding:2px 8px;border-radius:4px}
.note{font-size:13px;color:var(--mute)}
.hide{display:none}
</style></head><body>

function lineup(ids,L,sl){
 const ps=ids.map(byId).filter(Boolean).map(p=>({p,v:adj(p,L)})).sort((a,b)=>b.v-a.v),used=new Set(),out=[];
 const take=(label,el)=>{const x=ps.find(y=>!used.has(y.p.id)&&el.includes(y.p.pos));if(x)used.add(x.p.id);out.push([label,x||null])};
 ["QB","RB","WR","TE"].forEach(pos=>{for(let i=0;i<sl[pos];i++)take(pos,[pos])});
 for(let i=0;i<sl.SF;i++)take("SF",["QB","RB","WR","TE"]);
 for(let i=0;i<sl.FLEX;i++)take("FLEX",["RB","WR","TE"]);
 return out;
}
function mkLsum(V,sl){
 return ids=>{const ps=[];for(const id of ids){const x=V.get(id);if(x)ps.push(x)}
  ps.sort((a,b)=>b.v-a.v);const used=new Set();let tot=0;
  const take=el=>{for(let i=0;i<ps.length;i++){if(!used.has(i)&&el.includes(ps[i].p.pos)){used.add(i);tot+=ps[i].v;return}}};
  ["QB","RB","WR","TE"].forEach(pos=>{for(let i=0;i<sl[pos];i++)take([pos])});
  for(let i=0;i<sl.SF;i++)take(["QB","RB","WR","TE"]);for(let i=0;i<sl.FLEX;i++)take(["RB","WR","TE"]);
  return tot}}
function makeOffers(L,me,R){
 const V=new Map();S.players.forEach(p=>V.set(p.id,{p,v:adj(p,L)}));
 const ls=mkLsum(V,SLOTS[L.id]),P=1+L.stud;
 const sc=ids=>{let t=0;ids.forEach(id=>{t+=Math.pow(V.get(id).v,P)});return Math.pow(t,1/P)};
 const mine=me.p.filter(id=>V.has(id)),base=ls(mine);
 const pool=[...mine].sort((a,b)=>V.get(b).v-V.get(a).v).slice(0,14).filter(id=>V.get(id).v>=500),combos=[];
 for(let i=0;i<pool.length;i++){combos.push([pool[i]]);for(let j=i+1;j<pool.length;j++){combos.push([pool[i],pool[j]])}}
 const res=[];
 R.filter(t=>!t.me).forEach(t=>{const tp=t.p.filter(id=>V.has(id)),tb=ls(tp);
  tp.map(id=>V.get(id)).filter(x=>x.p.pos!=="PICK"&&x.v>=1200).sort((a,b)=>b.v-a.v).slice(0,10).forEach(x=>{
   const gs=x.v;let best=null;
   for(const c of combos){const s=sc(c);if(s<gs*.97||s>gs*1.12)continue;
    const mi=mine.filter(id=>!c.includes(id));mi.push(x.p.id);const md=ls(mi)-base;if(md<200)continue;
    const td=ls(tp.filter(id=>id!==x.p.id).concat(c))-tb;if(td<-300)continue;
    const obj=md-.25*Math.max(0,s-gs);if(!best||obj>best.obj)best={c,md,td,obj}}
   if(best)res.push({t,x,...best})})});
 res.sort((a,b)=>b.obj-a.obj);
 const seen=new Set(),out=[];for(const r of res){if(seen.has(r.x.p.id))continue;seen.add(r.x.p.id);out.push({...r,V});if(out.length>=6)break}
 return out}

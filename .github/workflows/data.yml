name: Refresh values
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-data.mjs
      - name: Grade predictions and retrain
        run: node scripts/grade.mjs
        continue-on-error: true
        timeout-minutes: 20
      - name: Pick history backfill (only when missing)
        run: if [ ! -f data/pick-hits.json ] || [ ! -f data/pick-seasons.json ]; then python3 -I scripts/backfill-picks.py; fi
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Claude draft board
        run: python3 -I scripts/claude-board.py
        continue-on-error: true
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sample market trades
        run: node scripts/crawl-trades.mjs
        continue-on-error: true
        timeout-minutes: 25
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh values $(date -u +%F)"
          git push
